name: Compile Linux Trial Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile Aegis for Linux
      run: |
        mkdir build
        cd build
        cmake ..
        make

    - name: Upload Linux Binary
      uses: actions/upload-artifact@v4
      with:
        name: aegis_linux_trial
        path: build/aegis_test
